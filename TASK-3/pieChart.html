<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid black;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display:inline-block ;
        }
        .conic{
            background: conic-gradient(rgb(255, 147, 147),rgb(255,147,147) 40deg, rgb(230, 255, 139) 40deg, rgb(230, 255, 139) 100deg, rgb(111, 248, 99) 100deg,rgb(11,248,99) 180deg,rgb(99,99,248) 180deg,rgb(99,99,248) 270deg,rgb(146, 1, 250) 270deg, rgb(146,1,250) 360deg);
        }
        h3{
            display: inline;
        }
        
    </style>
</head>
<body>
    <div class="box conic">
        <pre style="text-align: left; position: absolute; top: 8px; left: 114px;"><small> Vaccine<br>0-2years<br> 40%</small></pre>
        <pre style="text-align: left; position: absolute; top: 60px; left: 135px; "><small>  Vaccine<br>  2-5years<br >    60%</small></pre>
        <pre style="text-align: left; display: inline-block; position: absolute; top: 120px; left: 125px;"><small> Vaccine<br>5-8years<br>  80%</small></pre>
        <pre style="text-align: left; display: inline-block; position: absolute; top: 120px; left: 35px;"><small> Vaccine <br>8-12Years<br>   90%</small></pre>
        <pre style="text-align: left; position: absolute; top: 35px; left: 25px;"><small>   Vaccine<br>  12-15Years<br>     90%</small></pre>        
    </div>
    <h3> VACCINATION DELAY CHART</h3>
    </div>
</body>
</html>
