<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        body {
            background-color: #bf5700;
            font-family: 'Poppins', sans-serif;
            color: #E5DADA;
            margin: 0;
        }

        #navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #58355e;
            height: 40px;
            padding: 25px 80px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        a {
            text-decoration: none;
            margin: 25px;
            color: #E5DADA;
        }

        #hero {
            padding: 80px;
            width: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #hero-content {
            width: 50%;
        }

        .buttons {
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .cv-btn {
            background: #58355e;
            border: none;
            color: white;
        }

        .contact-btn {
            background: transparent;
            border: 1px solid #58355e;
            color: #58355e;
            margin-left: 15px;
        }

        .profile {
            width: 400px;
            height: 400px;
            border: 3px solid #8B5CF6;
            border-radius: 50%;
            overflow: hidden;
        }

    </style>
</head>

<body>

    <nav id="navbar">

        <h2>Portfolio</h2>

        <section class="nav-links">

            <a href="index.html">Home</a>

    <section id="hero">

                Hello I'm
            </h3>

            <h1 style="font-size: 70px;">
                Suhani <span style="color: #eeff04;">Garg</span>
            </h1>

            <h2>
                Full Stack Developer
            </h2>

            <p style="font-size: larger;">
                I build responsive and dynamic web applications
                using modern technologies. Passionate about clean
                code and great user experiences.
            </p>

            <section class="buttons">

                <button class="cv-btn">
                    Download CV
                </button>

                <button class="contact-btn">
                    Contact Me
                </button>

            </section>

        </div>

        <div class="profile">
