<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("PRIME NUMBERS BETWEEN 1 TO 100");
        document.write("<br>");
        document.write("<br>");
        document.write("<br>");
        for(let i=0;i<=100;i++){
        let count = 0;
        for(let j=0;j<=i;j++){
            if(i%j==0){
                count++;
            }
        }
        if(count==2){
            document.write(i+"<br>");
        }
    }
    </script>
</body>
</html>
