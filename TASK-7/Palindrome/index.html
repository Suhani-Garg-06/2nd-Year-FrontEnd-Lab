<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=12321;
        let org=n;
        let rev=0;
        while(n>0){
            let rem=n%10;
            rev= rev*10+rem;
            n=Math.round(n/10);
        }
        if(rev===org){
            document.write(`${org} is a Palindrome Number`);
        }
        else{
           document.write(`${org} is not a Palindrome Number`); 
        }
    </script>
</body>
</html>
