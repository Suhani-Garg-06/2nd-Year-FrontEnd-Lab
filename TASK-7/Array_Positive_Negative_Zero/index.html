<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr=[1,-2,-6,7,0,0,9,0,2,3];
        let sumP=0;
        let sumN=0;
        let countZero=0;
        for(let i = 0; i < arr.length; i++){
            if(arr[i]>0){
                sumP+=arr[i];
            }
            else if(arr[i]<0){
                sumN+=arr[i];
            }
            else{
                countZero++;
            }
        }
        document.write(`Elements of Array [ ${arr} ]<br>`);
        document.write("Sum of Positive Numbers: " + sumP + "<br>");
        document.write("Sum of Negative Numbers: " + sumN + "<br>");
        document.write("Count of Zeros: " + countZero + "<br>");
    </script>
</body>
</html>
